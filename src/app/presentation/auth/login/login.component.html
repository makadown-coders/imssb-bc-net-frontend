<section class="login-page">
  <article hlmCard class="login-card">
    <header hlmCardHeader class="login-header"><img class="login-logo" src="imssb-logo.svg" alt="IMSS Bienestar" /><h1 hlmCardTitle>Bienvenido</h1><p hlmCardDescription>Ingresa tus credenciales institucionales para continuar.</p></header>
    <div hlmCardContent>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <div class="field-group"><label hlmLabel for="email">Correo institucional</label><div class="input-wrap"><ng-icon name="lucideMail" /><input hlmInput id="email" formControlName="email" type="email" autocomplete="username" placeholder="nombre@imssbienestar.gob.mx" /></div>@if (form.controls.email.touched && form.controls.email.invalid) {<p class="field-error">Ingresa un correo válido.</p>}</div>
        <div class="field-group"><label hlmLabel for="password">Contraseña</label><div class="input-wrap"><ng-icon name="lucideLockKeyhole" /><input hlmInput id="password" formControlName="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" /></div>@if (form.controls.password.touched && form.controls.password.invalid) {<p class="field-error">La contraseña es obligatoria.</p>}</div>
        <button hlmBtn size="lg" class="login-button" type="submit" [disabled]="isLoading()">@if (isLoading()) {<hlm-spinner aria-label="Iniciando sesión" />} @else {<ng-icon name="lucideLogIn" />}<span>Iniciar sesión</span></button>
      </form>
    </div>
  </article>
</section>
