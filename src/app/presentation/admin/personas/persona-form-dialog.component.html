<header class="dialog-header"><h2>{{ data.persona ? 'Editar persona' : 'Nueva persona' }}</h2></header>
<div [formGroup]="form" class="form-grid">
  <label class="form-field"><span hlmLabel>Nombres</span><input hlmInput formControlName="nombres" /></label><label class="form-field"><span hlmLabel>Apellidos</span><input hlmInput formControlName="apellidos" /></label>
  <label class="form-field"><span hlmLabel>Cargo</span><input hlmInput formControlName="cargo" /></label><label class="form-field"><span hlmLabel>Unidad médica</span><select [value]="selectedUnidadId()" (change)="selectUnidad($any($event.target).value)"><option value="">Sin asignar</option>@for (unidad of data.unidadesMedicas; track unidad.id) {<option [value]="unidad.id">{{ unidad.nombre }}</option>}</select></label>
  <label class="form-field"><span hlmLabel>Correo principal</span><input hlmInput type="email" formControlName="correoPrincipal" /></label><label class="form-field"><span hlmLabel>Username</span><input hlmInput formControlName="username" /></label>
  <label class="form-field"><span hlmLabel>RFC</span><input hlmInput formControlName="rfc" /></label><label class="form-field"><span hlmLabel>CURP</span><input hlmInput formControlName="curp" /></label>
  <label class="checkbox-field"><hlm-checkbox formControlName="activo" />Persona activa</label>
</div>
<footer class="dialog-actions"><button hlmBtn variant="ghost" type="button" (click)="cancel()">Cancelar</button><button hlmBtn type="button" (click)="save()">Guardar</button></footer>
