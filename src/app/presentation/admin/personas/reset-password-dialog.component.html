<header class="dialog-header"><h2>Restablecer contraseña</h2><p>Asignarás una nueva contraseña a <strong>{{ persona.userEmail }}</strong>. Sus sesiones persistentes serán cerradas.</p></header>
<div [formGroup]="form" class="dialog-content"><label class="form-field"><span hlmLabel>Nueva contraseña</span><input hlmInput type="password" formControlName="newPassword" autocomplete="new-password" /><p class="field-hint">Entre 12 y 128 caracteres.</p>@if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {<p class="field-error">Ingresa al menos 12 caracteres.</p>}</label><label class="form-field"><span hlmLabel>Confirmar contraseña</span><input hlmInput type="password" formControlName="confirmation" autocomplete="new-password" />@if (form.controls.confirmation.touched && form.controls.newPassword.value !== form.controls.confirmation.value) {<p class="field-error">Las contraseñas no coinciden.</p>}</label></div>
<footer class="dialog-actions"><button hlmBtn variant="ghost" type="button" (click)="cancel()">Cancelar</button><button hlmBtn type="button" (click)="save()">Restablecer</button></footer>
