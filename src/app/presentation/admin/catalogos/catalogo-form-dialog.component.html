<section class="dialog-shell">
  <header class="dialog-header">
    <p class="dialog-eyebrow">Catálogo administrativo</p>
    <h2>{{ data.title }}</h2>
    <p>Captura o actualiza la información necesaria para mantener el catálogo al día.</p>
  </header>

  <form class="catalogo-dialog-form" [formGroup]="form">
    @for (field of data.fields; track field.key) {
      @switch (field.type) {
        @case ('textarea') {
          <label class="form-field span-2">
            <span hlmLabel>{{ field.label }}</span>
            <textarea hlmTextarea rows="3" [formControlName]="field.key"></textarea>
          </label>
        }
        @case ('number') {
          <label class="form-field">
            <span hlmLabel>{{ field.label }}</span>
            <input hlmInput type="number" step="any" [formControlName]="field.key" />
          </label>
        }
        @case ('select') {
          <label class="form-field">
            <span hlmLabel>{{ field.label }}</span>
            <select [formControlName]="field.key">
              @if (!field.required) {
                <option [ngValue]="null">Sin asignar</option>
              }
              @for (option of optionsFor(field); track option.id) {
                <option [ngValue]="option.id">{{ option.label }}</option>
              }
            </select>
          </label>
        }
        @case ('boolean') {
          <label class="checkbox-field span-2">
            <hlm-checkbox [formControlName]="field.key" />
            <span>{{ field.label }}</span>
          </label>
        }
        @default {
          <label class="form-field">
            <span hlmLabel>{{ field.label }}</span>
            <input hlmInput type="text" [maxlength]="field.maxLength || null" [formControlName]="field.key" />
          </label>
        }
      }
    }
  </form>

  <footer class="dialog-actions">
    <button hlmBtn variant="ghost" type="button" (click)="cancel()">Cancelar</button>
    <button hlmBtn type="button" (click)="save()">Guardar</button>
  </footer>
</section>
